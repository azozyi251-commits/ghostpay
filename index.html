<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostpay.work Store</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header {
            margin: 30px 0 20px;
        }
        h1 {
            color: #00d2ff;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        /* صندوق إدخال اسم اللاعب */
        .player-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            margin: 0 auto 40px;
            border: 1px solid #334155;
        }
        .player-box label {
            display: block;
            margin-bottom: 8px;
            color: #38bdf8;
            font-weight: bold;
        }
        .player-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            text-align: center;
        }
        /* حاوية البطاقات */
        .pricing-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #131c31;
            border: 1px solid #1e293b;
            border-radius: 16px;
            width: 260px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s, border-color 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #00d2ff;
        }
        .card.featured {
            border: 2px solid #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }
        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .price {
            font-size: 1.8rem;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .features {
            list-style: none;
            text-align: right;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .features li {
            margin-bottom: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        /* نافذة الدفع المنبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            border: 1px solid #475569;
            text-align: right;
        }
        .modal-content h3 {
            color: #00d2ff;
            margin-bottom: 15px;
            text-align: center;
        }
        .modal-content p {
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #e2e8f0;
        }
        .close-btn {
            background: #ef4444;
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ghostpay.work Store</h1>
        <p class="subtitle">اختر رتبتك وارتفع إلى قمة الإمبراطورية</p>
    </header>

    <!-- حقل اسم اللاعب -->
    <div class="player-box">
        <label for="playerName">اكتب اسمك في السيرفر (Minecraft Username):</label>
        <input type="text" id="playerName" placeholder="مثال: KingofMachineError" required>
    </div>

    <!-- خطة الرتب -->
    <div class="pricing-container">

        <div class="card featured">
